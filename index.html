<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lewis Frontend</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    button {
      margin: 10px 0;
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
    }
    h2 {
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <h1>Hi this is front end for my bookstore</h1>


   <h2>Books</h2>
  <button id="loadBooks">Load books</button>
  
  <ul id="bookList"></ul>


     <h2>Authors</h2>
  <button id="loadAuthors">Load buthors</button>

  <ul id="authorList"></ul>

  <h2>Users</h2>
  <button id="loadUsers">Load users</button>

  <ul id="userList"></ul>

  <script>
    const API = "https://lewis-bookstore-api.onrender.com";

    // Load Books
    document.getElementById("loadBooks").addEventListener("click", () => {
      fetch(`${API}/books`)
        .then(res => res.json())
        .then(data => {
          const list = document.getElementById("bookList");
          list.innerHTML = "";
          data.forEach(book => {
            const li = document.createElement("li");
            li.textContent = `${book.title} — ${book.author}`;
            list.appendChild(li);
          });
        })
        .catch(err => console.error("Books error:", err));
    });

    // Load Authors
    document.getElementById("loadAuthors").addEventListener("click", () => {
      fetch(`${API}/authors`)
        .then(res => res.json())
        .then(data => {
          const list = document.getElementById("authorList");
          list.innerHTML = "";
          data.forEach(author => {
            const li = document.createElement("li");
            li.textContent = author.name;
            list.appendChild(li);
          });
        })
        .catch(err => console.error("Authors error:", err));
    });

    // Load Users
    document.getElementById("loadUsers").addEventListener("click", () => {
      fetch(`${API}/users`)
        .then(res => res.json())
        .then(data => {
          const list = document.getElementById("userList");
          list.innerHTML = "";
          data.forEach(user => {
            const li = document.createElement("li");
            li.textContent = `${user.username} (${user.email})`;
            list.appendChild(li);
          });
        })
        .catch(err => console.error("Users error:", err));
    });
  </script>

</body>
</html>
